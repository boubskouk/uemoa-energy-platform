# Config Nginx - UEMOA Energy Platform sur VPS Hostinger
#
# Installation :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/uemoa-energy
#   sudo ln -s /etc/nginx/sites-available/uemoa-energy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remplacer VOTRE_IP_OU_DOMAINE ci-dessous par l'IP du VPS (en attendant le nom de domaine),
# puis par le domaine une fois acheté (et relancer certbot, voir le guide).

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_IP_OU_DOMAINE;

    # Frontend (fichiers statiques buildés par Vite)
    root /var/www/uemoa-energy/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets statiques : cache long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend API (proxy vers le process PM2 sur le port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    client_max_body_size 10M;
}

# Une fois le domaine acheté et pointé vers le VPS, lancer :
#   sudo certbot --nginx -d votre-domaine.com -d www.votre-domaine.com
# Certbot modifiera ce fichier automatiquement pour ajouter le bloc HTTPS (listen 443 + redirection 80->443).
